server.port=${DARIRENTALSMS1_BACK_PORT:8036}

# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.url=${DARIRENTALSMS1_DB_URL:jdbc:mysql://localhost:3306/darirentals?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC}
spring.main.allow-bean-definition-overriding=true
spring.application.name=app


spring.datasource.username=${DARIRENTALSMS1_DB_USER:root}
spring.datasource.password=${DARIRENTALSMS1_DB_PASSWORD:}

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql=true
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
spring.jpa.hibernate.ddl-auto=update
# Naming strategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy



## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=250000MB
# Max Request Size
spring.servlet.multipart.max-request-size=100000MB

# ===============================
# = SCAN DE FACTURES PAR IA (Gemini)
# ===============================
# Cle API a renseigner (ex: variable d'env GEMINI_API_KEY) - NE JAMAIS committer une vraie cle ici.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
# Dossier local ou les factures scannees sont conservees (chemin relatif au dossier de lancement du backend).
invoice.upload.dir=${INVOICE_UPLOAD_DIR:uploads/invoices}

# ===============================
# = SYNCHRONISATION DES TAUX DE CHANGE (ExchangeRate-API)
# ===============================
# Cle API a renseigner (variable d'env EXCHANGERATE_API_KEY) - NE JAMAIS committer une vraie cle ici.
# Cree gratuitement sur https://www.exchangerate-api.com/ (compte a creer par l'utilisateur).
exchangerate.api.key=${EXCHANGERATE_API_KEY:}



